<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" />
  <!-- Collaborative Loop Path (Infinite Rove) -->
  <path d="M150 256 C150 180, 230 180, 256 256 C282 332, 362 332, 362 256 C362 180, 282 180, 256 256 C230 332, 150 332, 150 256 Z" 
        fill="none" 
        stroke="url(#strokeGrad)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  <!-- Sparkles -->
  <path d="M380 120 L390 140 L410 150 L390 160 L380 180 L370 160 L350 150 L370 140 Z" fill="#FFF" />
  <path d="M120 360 L125 370 L135 375 L125 380 L120 390 L115 380 L105 375 L115 370 Z" fill="#22D3EE" />
</svg>